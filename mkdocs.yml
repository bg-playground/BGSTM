site_name: BGSTM — Better Global Software Testing Methodology
site_description: A practical, six-phase, methodology-agnostic software testing framework for Agile, Scrum, Waterfall, and hybrid delivery models
site_author: BGSTM Project
site_url: https://bg-playground.github.io/BGSTM/

repo_name: bg-playground/BGSTM
repo_url: https://github.com/bg-playground/BGSTM
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024-2026 BGSTM Project. Licensed under the MIT License.

draft_docs: '!*'  # Do not exclude any files as drafts
exclude_docs: |
  README.md
  examples/README.md
  methodologies/README.md
  test-templates/README.md
  templates/**

# Repository-relative links can intentionally point to source files outside
# docs/. The dedicated Markdown-link checker validates those paths across the
# full repository; MkDocs should report them without failing the site build.
validation:
  nav:
    omitted_files: warn
  links:
    not_found: info

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  favicon: assets/favicon.png
  logo: assets/logo.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bg-playground/BGSTM
      name: BGSTM on GitHub
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags
  - minify:
      minify_html: true

nav:
